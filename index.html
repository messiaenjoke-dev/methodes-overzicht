function Login({onLogin}) {
  const [sel, setSel] = useState('');
  const [pw, setPw] = useState('');
  const [show, setShow] = useState(false);
  const [err, setErr] = useState('');
  
  const go = () => {
    if(!sel || !pw) { setErr('Vul alles in'); return; }
    const c = passwords[sel];
    if(Array.isArray(c) ? c.includes(pw) : c === pw) { onLogin(sel); }
    else { setErr('Onjuist wachtwoord'); }
  };
  
  return (
    <div className="min-h-screen bg-gradient-to-br from-blue-600 to-purple-700 flex items-center justify-center p-6">
      <div className="w-full max-w-md">
        <div className="text-center mb-8">
          <div className="inline-flex items-center justify-center w-20 h-20 bg-white rounded-2xl shadow-xl mb-6">
            <Icon name="BookOpen" className="w-10 h-10 text-blue-600"/>
          </div>
          <h1 className="text-3xl font-bold text-white mb-2">Methodes Overzicht</h1>
          <p className="text-blue-100">Scholengroep Sint-Rembert</p>
        </div>
        <div className="bg-white rounded-2xl shadow-2xl p-8 space-y-4">
          <h2 className="text-xl font-bold flex items-center gap-2">
            <Icon name="Lock" className="w-5 h-5 text-blue-600"/>Aanmelden
          </h2>
          <select value={sel} onChange={e => {setSel(e.target.value);setErr('');}} className="w-full p-3 border rounded-xl">
            <option value="">Kies school...</option>
            {schools.map(s => <option key={s} value={s}>{s}</option>)}
          </select>
          <div className="relative">
            <input type={show?'text':'password'} value={pw} onChange={e => {setPw(e.target.value);setErr('');}} onKeyDown={e => {if(e.key==='Enter')go();}} placeholder="Wachtwoord..." className="w-full p-3 pr-12 border rounded-xl"/>
            <button onClick={() => setShow(!show)} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400">
              <Icon name={show ? 'EyeOff' : 'Eye'} className="w-5 h-5"/>
            </button>
          </div>
          {err && <div className="bg-red-50 border border-red-200 rounded-xl p-3 text-red-700 text-sm flex items-center gap-2"><Icon name="AlertCircle" className="w-4 h-4"/>{err}</div>}
          <button onClick={go} className="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold rounded-xl flex items-center justify-center gap-2">
            <Icon name="Lock" className="w-4 h-4"/>Inloggen
          </button>
        </div>
      </div>
    </div>
  );
}

// ============================================================================
// CARD COMPONENT
// ============================================================================
function Card({m, n, v, u, cnt, mu, showCnt}) {
  const nkl = niveauKleuren[n] || ['bg-gray-100','text-gray-700'];
  return (
    <div className="bg-white rounded-xl p-4 shadow-sm">
      <div className="flex justify-between mb-2">
        <h4 className="font-semibold text-slate-800">{m}</h4>
        <span className={`${nkl[0]} ${nkl[1]} text-xs px-2 py-0.5 rounded-full`}>{niveauLabels[n]}</span>
      </div>
      {v && <p className="text-xs text-slate-600 mb-1">{v}</p>}
      <p className="text-xs text-slate-500 mb-2">{u || mu[m] || '?'}</p>
      {showCnt && <div className="text-sm text-slate-500 flex items-center gap-1"><Icon name="School" className="w-3.5 h-3.5"/>{cnt} school{cnt!==1?'en':''}</div>}
    </div>
  );
}

// ============================================================================
// MAIN APP
// ============================================================================
function App() {
  const [user, setUser] = useState(null);
  const [school, setSchool] = useState(null);
  const [edit, setEdit] = useState(false);
  const [view, setView] = useState('vak');
  const [niv, setNiv] = useState('alle');
  const [jaar, setJaar] = useState('2025-2026');
  const [toast, setToast] = useState(null);
  const [data, setData] = useState({'2025-2026': createData(), '2026-2027': createEmpty()});
  const [mu, setMu] = useState(defMU);
  const [modal, setModal] = useState(null);
  const [hist, setHist] = useState([]);
  const [online, setOnline] = useState(true);
  const [addNaam, setAddNaam] = useState('');
  const [addUitg, setAddUitg] = useState('');
  const [addErr, setAddErr] = useState('');
  const [newUitg, setNewUitg] = useState('');
  const [showNewUitg, setShowNewUitg] = useState(false);
  const [addVak, setAddVak] = useState('');
  const [addNiv, setAddNiv] = useState([]);
  const [addToSchool, setAddToSchool] = useState(true);
  const [form, setForm] = useState(null);
  const [formChanged, setFormChanged] = useState(false);
  const [syncing, setSyncing] = useState(false);
  const [cellPopup, setCellPopup] = useState(null);

  const cur = data[jaar];
  const mList = useMemo(() => Object.keys(mu).sort(), [mu]);
  const uList = useMemo(() => [...new Set(Object.values(mu))].sort(), [mu]);

  // Merge helper
  const mergeData = (p) => {
    const merged2025 = createData();
    const merged2026 = createEmpty();
    if(p.data && p.data['2025-2026']) {
      Object.keys(p.data['2025-2026']).forEach(school => {
        if(merged2025[school]) {
          Object.keys(p.data['2025-2026'][school]).forEach(vak => {
            if(p.data['2025-2026'][school][vak]) {
              Object.keys(p.data['2025-2026'][school][vak]).forEach(niv => {
                if(p.data['2025-2026'][school][vak][niv]?.length > 0) {
                  merged2025[school][vak][niv] = p.data['2025-2026'][school][vak][niv];
                }
              });
            }
          });
        }
      });
    }
    if(p.data && p.data['2026-2027']) {
      Object.keys(p.data['2026-2027']).forEach(school => {
        if(merged2026[school]) {
          Object.keys(p.data['2026-2027'][school]).forEach(vak => {
            if(p.data['2026-2027'][school][vak]) {
              Object.keys(p.data['2026-2027'][school][vak]).forEach(niv => {
                if(p.data['2026-2027'][school][vak][niv]?.length > 0) {
                  merged2026[school][vak][niv] = p.data['2026-2027'][school][vak][niv];
                }
              });
            }
          });
        }
      });
    }
    return {'2025-2026': merged2025, '2026-2027': merged2026};
  };

  // Load from Google Sheets
  const loadFromSheets = async () => {
    try {
      const response = await fetch(SCRIPT_URL + '?action=get');
      const text = await response.text();
      if(text && text !== '{}' && text.trim().length > 2) {
        const p = JSON.parse(text);
        const mergedData = mergeData(p);
        setData(mergedData);
        if(p.mu) setMu({...defMU, ...p.mu});
        if(p.hist) setHist(p.hist || []);
        setOnline(true);
        return true;
      }
    } catch(e) {
      console.error('Load error:', e);
      setOnline(false);
    }
    return false;
  };

  // Save to Google Sheets
  const saveToSheets = async (nd, nm, nh) => {
    try {
      const payload = JSON.stringify({data: nd, mu: nm, hist: nh});
      await fetch(SCRIPT_URL + '?action=set', {
        method: 'POST',
        mode: 'no-cors',
        headers: {'Content-Type': 'application/json'},
        body: payload
      });
      setOnline(true);
      return true;
    } catch(e) {
      console.error('Save error:', e);
      setOnline(false);
      return false;
    }
  };

  // Sync data
  const syncData = async () => {
    setSyncing(true);
    const success = await loadFromSheets();
    if(success) {
      setToast({m:'Gesynchroniseerd met Google Sheets!',t:'s'});
    } else {
      setToast({m:'Synchronisatie mislukt',t:'e'});
    }
    setSyncing(false);
  };

  // Load on mount
  useEffect(() => { loadFromSheets(); }, []);

  // Toast timeout
  useEffect(() => {
    if(toast) {
      const t = setTimeout(() => setToast(null), 3000);
      return () => clearTimeout(t);
    }
  }, [toast]);

  // Form edit
  useEffect(() => {
    if(edit && school) {
      setForm(JSON.parse(JSON.stringify(cur[school] || emptyV())));
      setFormChanged(false);
    }
  }, [edit, school, cur]);

  // Save function
  const save = async (nd, nm, h) => {
    const newData = nd || data;
    const newMu = nm || mu;
    const nh = h ? [h, ...hist].slice(0,100) : hist;
    
    if(nd) setData(nd);
    if(nm) setMu(nm);
    if(h) setHist(nh);
    
    const success = await saveToSheets(newData, newMu, nh);
    if(success) {
      setToast({m:'Opgeslagen naar Google Sheets!',t:'s'});
      return true;
    } else {
      setToast({m:'Opslaan mislukt',t:'e'});
      return false;
    }
  };

  // Count methods per vak
  const mCnt = useMemo(() => {
    const c = {};
    schools.forEach(s => {
      vakBases.forEach(vb => {
        getNiveaus(vb).forEach(n => {
          (cur[s]?.[vb]?.[n] || []).forEach(m => {
            c[vb+'|'+m] = (c[vb+'|'+m]||0) + 1;
          });
        });
      });
    });
    return c;
  }, [cur]);

  // Per vak view
  const perVak = useMemo(() => {
    const r = {};
    const ts = school ? [school] : schools;
    vakken.forEach((v, i) => {
      const map = {};
      const vn = getNiveaus(vakBases[i]);
      const fn = niv==='alle' ? vn : (vn.includes(niv) ? [niv] : []);
      ts.forEach(s => {
        fn.forEach(n => {
          (cur[s]?.[vakBases[i]]?.[n] || []).forEach(m => {
            const k = m+'|'+n;
            if(!map[k]) map[k] = {m, n, s:[]};
            if(!map[k].s.includes(s)) map[k].s.push(s);
          });
        });
      });
      r[v] = map;
    });
    return r;
  }, [cur, niv, school]);

  // Per uitgeverij view
  const perUitg = useMemo(() => {
    const map = {};
    const ts = school ? [school] : schools;
    ts.forEach(s => {
      vakBases.forEach((vb, i) => {
        const vn = getNiveaus(vb);
        const fn = niv==='alle' ? vn : (vn.includes(niv) ? [niv] : []);
        fn.forEach(n => {
          (cur[s]?.[vb]?.[n] || []).forEach(m => {
            const u = mu[m] || 'Onbekend';
            if(!map[u]) map[u] = {};
            const k = m+'|'+vakken[i]+'|'+n;
            if(!map[u][k]) map[u][k] = {m, v:vakken[i], n, s:[]};
            if(!map[u][k].s.includes(s)) map[u][k].s.push(s);
          });
        });
      });
    });
    return map;
  }, [cur, niv, school, mu]);

  if(!user) return <Login onLogin={setUser}/>;

  // Edit functions
  const addMethode = (vb, n, val) => {
    if(!val || !form) return;
    const arr = form[vb]?.[n] || [];
    if(arr.includes(val)) return;
    const newForm = JSON.parse(JSON.stringify(form));
    if(!newForm[vb]) newForm[vb] = {};
    if(!newForm[vb][n]) newForm[vb][n] = [];
    newForm[vb][n].push(val);
    setForm(newForm);
    setFormChanged(true);
  };

  const rmMethode = (vb, n, val) => {
    if(!form) return;
    const newForm = JSON.parse(JSON.stringify(form));
    if(newForm[vb]?.[n]) {
      newForm[vb][n] = newForm[vb][n].filter(x => x !== val);
    }
    setForm(newForm);
    setFormChanged(true);
  };

  const saveForm = async () => {
    const h = {id: Date.now(), timestamp: new Date().toISOString(), school: user, action: 'Bijgewerkt', details: school, jaar};
    const newData = JSON.parse(JSON.stringify(data));
    newData[jaar][school] = form;
    if(await save(newData, null, h)) {
      setFormChanged(false);
    }
  };

  const addNewMethode = async () => {
    const tn = addNaam.trim();
    const finalUitg = addUitg === '__new__' ? newUitg.trim() : addUitg;
    if(!tn) { setAddErr('Vul naam in'); return; }
    if(!finalUitg) { setAddErr('Kies of vul uitgeverij in'); return; }
    if(mu[tn]) { setAddErr('Methode bestaat al'); return; }
    
    if(addToSchool && addVak && addNiv.length === 0) {
      setAddErr('Selecteer minstens één niveau'); 
      return; 
    }
    
    const newMu = {...mu, [tn]: finalUitg};
    let newData = null;
    let details = tn + ' (' + finalUitg + ')';
    
    if(addToSchool && addVak && addNiv.length > 0) {
      newData = JSON.parse(JSON.stringify(data));
      const vbIndex = vakken.indexOf(addVak);
      const vb = vakBases[vbIndex];
      addNiv.forEach(n => {
        if(!newData[jaar][user][vb]) newData[jaar][user][vb] = {};
        if(!newData[jaar][user][vb][n]) newData[jaar][user][vb][n] = [];
        if(!newData[jaar][user][vb][n].includes(tn)) {
          newData[jaar][user][vb][n].push(tn);
        }
      });
      details += ' → ' + user + ' / ' + addVak + ' / ' + addNiv.map(n => niveauLabels[n]).join(', ');
    }
    
    const h = {id: Date.now(), timestamp: new Date().toISOString(), school: user, action: 'Methode toegevoegd', details, jaar};
    
    if(await save(newData || data, newMu, h)) {
      if(edit && school === user && newData) {
        setForm(JSON.parse(JSON.stringify(newData[jaar][user])));
      }
      setModal(null);
      setAddNaam('');
      setAddUitg('');
      setNewUitg('');
      setShowNewUitg(false);
      setAddVak('');
      setAddNiv([]);
      setAddToSchool(true);
      setAddErr('');
    }
  };

  const downloadCSV = (all) => {
    const ts = all ? schools : [user];
    let csv = 'School;Vak;Niveau;Methode;Uitgeverij\n';
    ts.forEach(s => {
      vakBases.forEach((vb, i) => {
        getNiveaus(vb).forEach(n => {
          (cur[s]?.[vb]?.[n] || []).forEach(m => {
            csv += `"${s}";"${vakken[i]}";"${niveauLabels[n]}";"${m}";"${mu[m]||''}"\n`;
          });
        });
      });
    });
    const blob = new Blob(['\ufeff'+csv], {type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'methodes-'+jaar+'.csv';
    a.click();
    setModal(null);
    setToast({m:'Gedownload!',t:'s'});
  };

  const viewButtons = school 
    ? [['vak','Per vak'],['cards','Per school'],['uitgeverij','Per uitgeverij'],['methode','Per methode']]
    : [['vak','Per vak'],['cards','Per school'],['uitgeverij','Per uitgeverij'],['methode','Per methode'],['table','Tabel']];

  const nivButtons = ['alle','p','k','l1','l2_3','l4_6','l2_6'];

  return (
    <div>
      {/* Toast */}
      {toast && (
        <div className={`${toast.t==='s'?'bg-green-600':'bg-red-600'} fixed top-4 right-4 z-50 text-white px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3`}>
          <Icon name={toast.t==='s' ? 'CheckCircle' : 'XCircle'} className="w-5 h-5"/>
          {toast.m}
          <button onClick={() => setToast(null)} className="ml-2"><Icon name="X" className="w-4 h-4"/></button>
        </div>
      )}

      {/* Add Modal */}
      {modal==='add' && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4" onClick={() => {setModal(null);setShowNewUitg(false);setNewUitg('');setAddVak('');setAddNiv([]);setAddToSchool(true);}}>
          <div className="absolute inset-0 bg-black/50"/>
          <div className="relative w-full max-w-md bg-white rounded-2xl p-6 max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
            <div className="flex justify-between mb-6">
              <h2 className="text-xl font-bold flex items-center gap-2"><Icon name="Plus" className="w-5 h-5 text-green-600"/>Nieuwe methode</h2>
              <button onClick={() => {setModal(null);setShowNewUitg(false);setNewUitg('');setAddVak('');setAddNiv([]);setAddToSchool(true);}} className="p-2 hover:bg-slate-100 rounded-lg"><Icon name="X" className="w-5 h-5"/></button>
            </div>
            <div className="space-y-4">
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">Naam methode *</label>
                <input value={addNaam} onChange={e => {setAddNaam(e.target.value);setAddErr('');}} placeholder="Bijv. Nieuwe Taalmethode" className="w-full p-3 border rounded-xl"/>
              </div>
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">Uitgeverij *</label>
                <select value={addUitg} onChange={e => {setAddUitg(e.target.value);setShowNewUitg(e.target.value==='__new__');setAddErr('');}} className="w-full p-3 border rounded-xl">
                  <option value="">Kies uitgeverij...</option>
                  {uList.map(u => <option key={u} value={u}>{u}</option>)}
                  <option value="__new__">+ Nieuwe uitgeverij toevoegen...</option>
                </select>
              </div>
              {showNewUitg && (
                <input value={newUitg} onChange={e => {setNewUitg(e.target.value);setAddErr('');}} placeholder="Naam nieuwe uitgeverij" className="w-full p-3 border rounded-xl border-green-300 bg-green-50"/>
              )}
              
              <div className="border-t pt-4 mt-4">
                <label className="flex items-center gap-3 cursor-pointer">
                  <input type="checkbox" checked={addToSchool} onChange={e => {setAddToSchool(e.target.checked);setAddErr('');}} className="w-5 h-5 rounded border-slate-300 text-blue-600"/>
                  <span className="font-medium">Direct koppelen aan {user}</span>
                </label>
              </div>
              
              {addToSchool && (
                <div className="bg-blue-50 border border-blue-200 rounded-xl p-4 space-y-4">
                  <div>
                    <label className="block text-sm font-medium text-blue-800 mb-1">Vak</label>
                    <select value={addVak} onChange={e => {setAddVak(e.target.value);setAddNiv([]);setAddErr('');}} className="w-full p-3 border border-blue-200 rounded-xl bg-white">
                      <option value="">Kies vak...</option>
                      {vakken.map(v => <option key={v} value={v}>{v}</option>)}
                    </select>
                  </div>
                  
                  {addVak && (
                    <div>
                      <label className="block text-sm font-medium text-blue-800 mb-2">Niveau(s)</label>
                      <div className="flex flex-wrap gap-2">
                        {getNiveaus(vakBases[vakken.indexOf(addVak)]).map(n => {
                          const isSelected = addNiv.includes(n);
                          const nkl = niveauKleuren[n] || ['bg-gray-100','text-gray-700'];
                          return (
                            <button key={n} type="button" onClick={() => {
                              if(isSelected) setAddNiv(addNiv.filter(x => x !== n));
                              else setAddNiv([...addNiv, n]);
                              setAddErr('');
                            }} className={`px-4 py-2 rounded-lg font-medium transition-all ${isSelected ? nkl[0]+' '+nkl[1]+' ring-2 ring-offset-1 ring-blue-400' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'}`}>
                              {niveauLabels[n]}
                            </button>
                          );
                        })}
                      </div>
                      <button type="button" onClick={() => {
                        const allNivs = getNiveaus(vakBases[vakken.indexOf(addVak)]);
                        setAddNiv(addNiv.length === allNivs.length ? [] : allNivs);
                      }} className="text-xs text-blue-600 mt-2 hover:underline">
                        {addNiv.length === getNiveaus(vakBases[vakken.indexOf(addVak)]).length ? 'Deselecteer alle' : 'Selecteer alle niveaus'}
                      </button>
                    </div>
                  )}
                </div>
              )}
              
              {addErr && <div className="bg-red-50 border border-red-200 rounded-xl p-3 text-red-700 text-sm flex items-center gap-2"><Icon name="AlertCircle" className="w-4 h-4"/>{addErr}</div>}
              <button onClick={addNewMethode} className="w-full py-3 bg-green-600 text-white font-semibold rounded-xl">
                {addToSchool && addVak && addNiv.length > 0 ? 'Toevoegen en koppelen' : 'Toevoegen'}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Export Modal */}
      {modal==='exp' && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4" onClick={() => setModal(null)}>
          <div className="absolute inset-0 bg-black/50"/>
          <div className="relative w-full max-w-md bg-white rounded-2xl" onClick={e => e.stopPropagation()}>
            <div className="flex justify-between p-6 border-b">
              <h3 className="text-lg font-bold">Exporteren</h3>
              <button onClick={() => setModal(null)} className="p-2 hover:bg-slate-100 rounded-lg"><Icon name="X" className="w-5 h-5"/></button>
            </div>
            <div className="p-6 space-y-4">
              <button onClick={() => downloadCSV(true)} className="w-full border-2 rounded-xl p-5 text-left hover:bg-blue-50 flex items-center gap-4">
                <Icon name="School" className="w-8 h-8 text-blue-600"/><div><h4 className="font-bold">Alle scholen</h4></div>
              </button>
              <button onClick={() => downloadCSV(false)} className="w-full border-2 rounded-xl p-5 text-left hover:bg-green-50 flex items-center gap-4">
                <Icon name="FileDown" className="w-8 h-8 text-green-600"/><div><h4 className="font-bold">Alleen {user}</h4></div>
              </button>
            </div>
          </div>
        </div>
      )}

      {/* History Modal */}
      {modal==='hist' && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4" onClick={() => setModal(null)}>
          <div className="absolute inset-0 bg-black/50"/>
          <div className="relative w-full max-w-lg bg-white rounded-2xl max-h-[80vh] flex flex-col" onClick={e => e.stopPropagation()}>
            <div className="flex justify-between p-6 border-b">
              <h3 className="text-lg font-bold flex items-center gap-2"><Icon name="History" className="w-5 h-5 text-blue-600"/>Geschiedenis</h3>
              <button onClick={() => setModal(null)} className="p-2 hover:bg-slate-100 rounded-lg"><Icon name="X" className="w-5 h-5"/></button>
            </div>
            <div className="flex-1 overflow-y-auto p-4">
              {hist.length===0 ? <p className="text-center py-12 text-slate-500">Nog geen wijzigingen</p> : (
                <div className="space-y-3">
                  {hist.map(h => (
                    <div key={h.id} className="bg-slate-50 rounded-xl p-4">
                      <div className="flex justify-between mb-2">
                        <span className="font-medium">{h.school}</span>
                        <span className="text-xs text-slate-500">{new Date(h.timestamp).toLocaleDateString('nl-BE')}</span>
                      </div>
                      <p className="text-sm">{h.action}</p>
                      {h.details && <p className="text-xs text-slate-500">{h.details}</p>}
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      {/* Main Layout */}
      <div className="min-h-screen bg-gradient-to-br from-slate-50 to-blue-50">
        <header className="bg-white border-b sticky top-0 z-40 shadow-sm">
          <div className="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between flex-wrap gap-2">
            <div className="flex items-center gap-4">
              <button onClick={() => {setSchool(null);setEdit(false);setView('vak');}} className={`p-2 rounded-lg flex items-center gap-2 ${school ? 'hover:bg-slate-100' : 'bg-blue-100 text-blue-700'}`}>
                <Icon name="Home" className="w-5 h-5"/>
                {!school && <span className="font-medium text-sm">Home</span>}
              </button>
              <div className="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center"><Icon name="BookOpen" className="w-5 h-5 text-blue-600"/></div>
              <div>
                <h1 className="text-xl font-bold">{school || 'Methodes Overzicht'}</h1>
                {school ? (
                  school === user ? (
                    <p className="text-sm text-green-600 flex items-center gap-1"><Icon name="Check" className="w-3.5 h-3.5"/>Jouw school - bewerkbaar</p>
                  ) : (
                    <p className="text-sm text-amber-600 flex items-center gap-1"><Icon name="Lock" className="w-3.5 h-3.5"/>Alleen bekijken</p>
                  )
                ) : (
                  <p className="text-sm text-slate-500">Scholengroep Sint-Rembert</p>
                )}
              </div>
            </div>
            <div className="flex items-center gap-2 flex-wrap">
              <button onClick={syncData} disabled={syncing} className={`px-4 py-2 rounded-lg flex items-center gap-2 font-medium ${syncing ? 'bg-slate-100 text-slate-400' : 'bg-blue-100 text-blue-700 hover:bg-blue-200'}`}>
                <Icon name="RefreshCw" className={`w-4 h-4 ${syncing ? 'animate-spin' : ''}`}/>
                {syncing ? 'Laden...' : 'Sync'}
              </button>
              <button onClick={() => setModal('hist')} className="p-2 hover:bg-slate-100 rounded-lg" title="Geschiedenis"><Icon name="History" className="w-5 h-5 text-slate-500"/></button>
              <button onClick={() => setModal('exp')} className="px-4 py-2 bg-green-600 text-white rounded-lg flex items-center gap-2"><Icon name="Download" className="w-4 h-4"/>CSV</button>
              <div className={`px-2 py-1 rounded text-xs flex items-center gap-1 ${online?'bg-green-100 text-green-700':'bg-red-100 text-red-700'}`} title={online ? 'Online' : 'Offline'}>
                <Icon name={online ? 'Cloud' : 'CloudOff'} className="w-3 h-3"/>
                {online ? 'Online' : 'Offline'}
              </div>
              <div className="flex border rounded-xl p-1">
                {['2025-2026','2026-2027'].map(j => (
                  <button key={j} onClick={() => setJaar(j)} className={`px-3 py-1.5 rounded-lg text-sm font-bold ${jaar===j?'bg-indigo-600 text-white':'text-slate-500'}`}>{j}</button>
                ))}
              </div>
              <button onClick={() => {setSchool(user);setEdit(false);}} className="px-3 py-1.5 bg-blue-100 text-blue-700 rounded-full text-sm font-medium">{user}</button>
              <button onClick={() => {setUser(null);setSchool(null);setEdit(false);}} className="p-2 hover:bg-red-50 rounded-lg text-slate-500" title="Uitloggen"><Icon name="LogOut" className="w-4 h-4"/></button>
            </div>
          </div>
          
          {/* View buttons */}
          {!edit && (
            <div className="border-t bg-slate-50/50">
              <div className="max-w-7xl mx-auto px-6 py-2 flex flex-wrap gap-2 justify-between">
                <div className="flex gap-1 bg-white border rounded-lg p-1">
                  {viewButtons.map(item => (
                    <button key={item[0]} onClick={() => setView(item[0])} className={`px-3 py-1.5 rounded text-sm ${view===item[0]?'bg-blue-600 text-white':'text-slate-600'}`}>{item[1]}</button>
                  ))}
                </div>
                <div className="flex gap-1 bg-white border rounded-lg p-1">
                  {nivButtons.map(n => (
                    <button key={n} onClick={() => setNiv(n)} className={`px-3 py-1.5 rounded text-sm ${niv===n?'bg-slate-800 text-white':'text-slate-600'}`}>{n==='alle'?'Alle':niveauLabels[n]}</button>
                  ))}
                </div>
                {school===user && <button onClick={() => setEdit(true)} className="px-4 py-1.5 bg-green-600 text-white rounded-lg text-sm flex items-center gap-2"><Icon name="Edit3" className="w-4 h-4"/>Bewerken</button>}
              </div>
            </div>
          )}
          
          {/* Edit header */}
          {edit && (
            <div className="border-t bg-green-50">
              <div className="max-w-7xl mx-auto px-6 py-3 flex justify-between">
                <span className="font-medium text-green-700 flex items-center gap-2"><Icon name="Edit3" className="w-5 h-5"/>Bewerken: {school}</span>
                <button onClick={() => setEdit(false)} className="px-4 py-1.5 bg-white border rounded-lg text-sm">Klaar</button>
              </div>
            </div>
          )}
        </header>

        <main className="max-w-7xl mx-auto px-6 py-6" onClick={() => setCellPopup(null)}>
          {/* Edit mode */}
          {edit && form ? (
            <div className="space-y-6">
              <div className="bg-blue-50 border border-blue-200 rounded-2xl p-5 flex items-start gap-3">
                <Icon name="Info" className="w-6 h-6 text-blue-600"/>
                <div>
                  <h3 className="font-semibold text-blue-800 mb-2">Methode niet in de lijst?</h3>
                  <button onClick={() => setModal('add')} className="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm flex items-center gap-2"><Icon name="Plus" className="w-4 h-4"/>Nieuwe methode</button>
                </div>
              </div>
              {vakken.map((v, i) => {
                const vb = vakBases[i];
                const vn = getNiveaus(vb);
                const kl = vakKleuren[v];
                return (
                  <div key={v} className={`${kl[0]} ${kl[1]} border rounded-2xl`}>
                    <div className="p-4 border-b border-white/50 flex items-center gap-3">
                      <div className={`w-10 h-10 ${kl[3]} rounded-xl flex items-center justify-center`}><Icon name={vakIcons[v]} className="w-5 h-5 text-white"/></div>
                      <h3 className={`text-lg font-bold ${kl[2]}`}>{v}</h3>
                    </div>
                    <div className={`p-4 grid gap-4 sm:grid-cols-2 ${vn.length===3?'lg:grid-cols-3':'lg:grid-cols-4'}`}>
                      {vn.map(n => {
                        const nkl = niveauKleuren[n] || ['bg-gray-100','text-gray-700'];
                        const arr = form[vb]?.[n] || [];
                        return (
                          <div key={n} className="bg-white rounded-xl p-4">
                            <span className={`${nkl[0]} ${nkl[1]} inline-block text-xs px-2 py-0.5 rounded-full mb-3`}>{niveauLabels[n]}</span>
                            <div className="flex flex-wrap gap-2 mb-3 min-h-[32px]">
                              {arr.map(m => (
                                <span key={m} className="flex items-center gap-1 bg-slate-100 px-2 py-1 rounded-full text-sm">
                                  {m}
                                  <button onClick={() => rmMethode(vb,n,m)} className="hover:text-red-500"><Icon name="X" className="w-3 h-3"/></button>
                                </span>
                              ))}
                            </div>
                            <select onChange={e => {addMethode(vb,n,e.target.value);e.target.value='';}} defaultValue="" className="w-full p-2 border rounded-lg text-sm">
                              <option value="">+ Toevoegen...</option>
                              {mList.filter(m => !arr.includes(m)).map(m => <option key={m} value={m}>{m}</option>)}
                            </select>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
              {formChanged && (
                <div className="sticky bottom-4">
                  <button onClick={saveForm} className="w-full py-3 bg-green-600 text-white font-semibold rounded-xl flex items-center justify-center gap-2 shadow-lg"><Icon name="Check" className="w-5 h-5"/>Opslaan</button>
                </div>
              )}
            </div>
          ) : view==='vak' ? (
            <div>
              {vakken.map((v, i) => {
                const vn = getNiveaus(vakBases[i]);
                const items = Object.values(perVak[v]||{}).filter(x => vn.includes(x.n)).sort((a,b) => niveauOrder[a.n]-niveauOrder[b.n]||a.m.localeCompare(b.m));
                const kl = vakKleuren[v];
                return (
                  <div key={v} className={`${kl[0]} ${kl[1]} border rounded-2xl mb-6`}>
                    <div className="p-5 border-b border-white/50 flex items-center gap-3">
                      <div className={`w-10 h-10 ${kl[3]} rounded-xl flex items-center justify-center`}><Icon name={vakIcons[v]} className="w-5 h-5 text-white"/></div>
                      <div><h3 className={`text-lg font-bold ${kl[2]}`}>{v}</h3><p className="text-sm text-slate-500">{items.length} methode(s)</p></div>
                    </div>
                    <div className="p-5">
                      {items.length===0 ? <p className="text-slate-500 text-center py-4">Geen methodes</p> : (
                        <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
                          {items.map(x => <Card key={x.m+'|'+x.n} m={x.m} n={x.n} cnt={x.s.length} mu={mu} showCnt={!school}/>)}
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          ) : view==='cards' ? (
            <div className="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
              {schools.map(s => {
                let tot = 0;
                vakBases.forEach(vb => {
                  const fn = niv==='alle' ? getNiveaus(vb) : (getNiveaus(vb).includes(niv)?[niv]:[]);
                  fn.forEach(n => { tot += (cur[s]?.[vb]?.[n]||[]).length; });
                });
                const isActive = school === s;
                const isOwn = s === user;
                return (
                  <div key={s} className={`rounded-2xl border hover:shadow-lg transition-all ${isActive ? 'bg-blue-50 border-blue-300 ring-2 ring-blue-400' : isOwn ? 'bg-green-50 border-green-200' : 'bg-white'}`}>
                    <button onClick={() => {setSchool(s);setView('vak');}} className="w-full text-left p-5 flex items-center gap-3">
                      <div className={`w-10 h-10 rounded-xl flex items-center justify-center ${isActive ? 'bg-blue-600' : isOwn ? 'bg-green-600' : 'bg-blue-100'}`}>
                        <Icon name="School" className={`w-5 h-5 ${isActive || isOwn ? 'text-white' : 'text-blue-600'}`}/>
                      </div>
                      <div className="flex-1">
                        <div className="flex items-center gap-2">
                          <h3 className="font-bold">{s}</h3>
                          {isOwn ? (
                            <span className="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full flex items-center gap-1"><Icon name="Check" className="w-3 h-3"/>Jouw school</span>
                          ) : (
                            <span className="text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full flex items-center gap-1"><Icon name="Lock" className="w-3 h-3"/>Bekijken</span>
                          )}
                        </div>
                        <p className={`text-sm ${isActive ? 'text-blue-600' : 'text-slate-500'}`}>{tot} methode(s){isActive ? ' • Huidig' : ''}</p>
                      </div>
                    </button>
                  </div>
                );
              })}
            </div>
          ) : view==='table' ? (
            <div className="bg-white rounded-2xl border shadow-sm overflow-hidden relative">
              <div className="overflow-x-auto">
                <table className="w-full">
                  <thead>
                    <tr className="bg-slate-100">
                      <th className="px-4 py-3 text-left text-sm font-bold sticky left-0 bg-slate-100 border-b-2">School</th>
                      {vakken.map(v => <th key={v} className="px-3 py-3 text-left text-sm font-bold border-b-2 whitespace-nowrap">{v}</th>)}
                    </tr>
                  </thead>
                  <tbody>
                    {schools.map((s,idx) => (
                      <tr key={s} className={`${idx%2?'bg-slate-50/50':'bg-white'} hover:bg-blue-50/50`}>
                        <td onClick={() => {setSchool(s);setView('vak');}} className={`px-4 py-3 font-semibold sticky left-0 cursor-pointer border-r ${idx%2?'bg-slate-50':'bg-white'}`}>
                          <div className="flex items-center gap-2"><Icon name="School" className="w-4 h-4 text-blue-500"/>{s}</div>
                        </td>
                        {vakBases.map((vb, vbIdx) => {
                          const fn = niv==='alle' ? getNiveaus(vb) : (getNiveaus(vb).includes(niv)?[niv]:[]);
                          const msArr = [];
                          const msDetail = [];
                          fn.forEach(n => { 
                            (cur[s]?.[vb]?.[n]||[]).forEach(m => {
                              if(!msArr.includes(m)) msArr.push(m);
                              msDetail.push({m, n});
                            }); 
                          });
                          const cellKey = s + '|' + vb;
                          const isOpen = cellPopup === cellKey;
                          return (
                            <td key={vb} className="px-3 py-2 relative">
                              {msArr.length>0 ? (
                                <button onClick={e => {e.stopPropagation();setCellPopup(isOpen ? null : cellKey);}} className="flex flex-wrap gap-1 w-full text-left hover:bg-blue-50 rounded-lg p-1 -m-1 transition-colors">
                                  {msArr.slice(0,2).map(m => {
                                    const cnt = mCnt[vb+'|'+m]||0;
                                    return <span key={m} className="inline-flex items-center text-xs px-2 py-1 bg-blue-100 text-blue-700 rounded-full">{m}<span className="bg-blue-600 text-white px-1 rounded-full ml-1">{cnt}</span></span>;
                                  })}
                                  {msArr.length>2 && <span className="text-xs px-2 py-1 bg-slate-200 rounded-full">+{msArr.length-2}</span>}
                                </button>
                              ) : <span className="text-slate-300">—</span>}
                              {isOpen && msArr.length > 0 && (
                                <div className="absolute z-50 top-full left-0 mt-1 bg-white border border-slate-200 rounded-xl shadow-xl p-4 min-w-64 max-w-80" onClick={e => e.stopPropagation()}>
                                  <div className="flex justify-between items-center mb-3">
                                    <h4 className="font-bold text-slate-800">{vakken[vbIdx]}</h4>
                                    <button onClick={() => setCellPopup(null)} className="p-1 hover:bg-slate-100 rounded"><Icon name="X" className="w-4 h-4"/></button>
                                  </div>
                                  <p className="text-xs text-slate-500 mb-3">{s}</p>
                                  <div className="space-y-2">
                                    {msDetail.map((item, i) => {
                                      const nkl = niveauKleuren[item.n] || ['bg-gray-100','text-gray-700'];
                                      const cnt = mCnt[vb+'|'+item.m]||0;
                                      return (
                                        <div key={i} className="flex items-center justify-between bg-slate-50 rounded-lg p-2">
                                          <div>
                                            <span className="font-medium text-sm">{item.m}</span>
                                            <span className={`${nkl[0]} ${nkl[1]} text-xs px-2 py-0.5 rounded-full ml-2`}>{niveauLabels[item.n]}</span>
                                          </div>
                                          <span className="text-xs text-slate-500">{cnt} school{cnt!==1?'en':''}</span>
                                        </div>
                                      );
                                    })}
                                  </div>
                                  <p className="text-xs text-slate-400 mt-3">Uitgeverij: {mu[msArr[0]] || '?'}</p>
                                </div>
                              )}
                            </td>
                          );
                        })}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          ) : view==='uitgeverij' ? (
            <div>
              {Object.keys(perUitg).sort().map(u => {
                const items = Object.values(perUitg[u]).sort((a,b) => niveauOrder[a.n]-niveauOrder[b.n]||a.m.localeCompare(b.m));
                const kl = uitgKleuren[u] || uitgKleuren.Onbekend;
                return (
                  <div key={u} className={`${kl[0]} ${kl[1]} border rounded-2xl mb-6`}>
                    <div className="p-5 border-b border-white/50 flex items-center gap-3">
                      <div className={`w-10 h-10 ${kl[3]} rounded-xl flex items-center justify-center`}><Icon name="BookOpen" className="w-5 h-5 text-white"/></div>
                      <div><h3 className={`text-lg font-bold ${kl[2]}`}>{u}</h3><p className="text-sm text-slate-500">{items.length} methode(s)</p></div>
                    </div>
                    <div className="p-5 grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
                      {items.map(x => <Card key={x.m+'|'+x.v+'|'+x.n} m={x.m} n={x.n} v={x.v} u={u} cnt={x.s.length} mu={mu} showCnt={!school}/>)}
                    </div>
                  </div>
                );
              })}
            </div>
          ) : view==='methode' ? (
            <div className="space-y-6">
              <div className="flex justify-end">
                <button onClick={() => setModal('add')} className="px-4 py-2 bg-green-600 text-white rounded-xl font-medium flex items-center gap-2"><Icon name="Plus" className="w-4 h-4"/>Nieuwe methode</button>
              </div>
              <div className="bg-white rounded-2xl border">
                <div className="p-5 border-b flex items-center gap-3">
                  <div className="w-10 h-10 bg-indigo-100 rounded-xl flex items-center justify-center"><Icon name="BookOpen" className="w-5 h-5 text-indigo-600"/></div>
                  <div><h3 className="text-lg font-bold">Alle methodes (A-Z)</h3><p className="text-sm text-slate-500">{mList.length} methode(s)</p></div>
                </div>
                <div className="p-5 grid gap-3 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
                  {mList.map(m => (
                    <div key={m} className="bg-slate-50 border rounded-xl p-4">
                      <h4 className="font-semibold mb-1">{m}</h4>
                      <p className="text-xs text-slate-500">{mu[m]}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          ) : null}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
