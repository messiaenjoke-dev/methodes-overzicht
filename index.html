function Login({onLogin}) {
  const [sel, setSel] = useState('');
  const [pw, setPw] = useState('');
  const [show, setShow] = useState(false);
  const [err, setErr] = useState('');
  
  const go = () => {
    if(!sel || !pw) { setErr('Vul alles in'); return; }
    const c = passwords[sel];
    if(Array.isArray(c) ? c.includes(pw) : c === pw) { onLogin(sel); }
    else { setErr('Onjuist wachtwoord'); }
  };
  
  return (
    <div className="min-h-screen bg-gradient-to-br from-blue-600 to-purple-700 flex items-center justify-center p-6">
      <div className="w-full max-w-md">
        <div className="text-center mb-8">

          <p className="text-blue-100">Scholengroep Sint-Rembert</p>
        </div>
        <div className="bg-white rounded-2xl shadow-2xl p-8 space-y-4">
          <h2 className="text-xl font-bold flex items-center gap-2">🔒 Aanmelden</h2>
          <select value={sel} onChange={e => {setSel(e.target.value);setErr('');}} className="w-full p-3 border rounded-xl">
            <option value="">Kies school...</option>
            {schools.map(s => <option key={s} value={s}>{s}</option>)}
          </select>
          <div className="relative">
            <input type={show?'text':'password'} value={pw} onChange={e => {setPw(e.target.value);setErr('');}} onKeyDown={e => e.key==='Enter' && go()} placeholder="Wachtwoord..." className="w-full p-3 pr-12 border rounded-xl"/>
            <button onClick={() => setShow(!show)} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">{show ? '🙈' : '👁️'}</button>
          </div>
          {err && <div className="bg-red-50 border border-red-200 rounded-xl p-3 text-red-700 text-sm flex items-center gap-2">⚠️ {err}</div>}
          <button onClick={go} className="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold rounded-xl flex items-center justify-center gap-2">🔐 Inloggen</button>
        </div>
      </div>
    </div>
  );
}
