<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Methodes Overzicht - Sint-Rembert</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
        .animate-spin { animation: spin 1s linear infinite; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>
    <script type="text/babel">
// ============================================
// CONFIGURATIE
// ============================================
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbwXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX/exec';
const STORAGE_KEY = 'methodes-sgsr-v5';

// ============================================
// SCHOOL DATA - SCHOLENGROEP SINT-REMBERT
// ============================================
const schools = [
  { id: 'tenparke', name: 'Ten Parke', pw: 'TenParke@2024' },
  { id: 'groeituin', name: 'De Groeituin', pw: 'Groeituin@2024' },
  { id: 'oefenschool', name: 'De Oefenschool', pw: 'Oefenschool@2024' },
  { id: 'leeuw', name: 'De Leeuw', pw: 'Leeuw@2024' },
  { id: 'tweesprong', name: 'De Tweesprong', pw: 'Tweesprong@2024' },
  { id: 'boomhut', name: 'De Boomhut', pw: 'Boomhut@2024' },
  { id: 'wijnendale', name: 'Wijnendale', pw: 'Wijnendale@2024' },
  { id: 'driekoningen', name: 'Driekoningen', pw: 'Driekoningen@2024' },
  { id: 'torretjes', name: 'De Torretjes', pw: 'Torretjes@2024' },
  { id: 'stapsteen', name: 'De Stapsteen', pw: 'Stapsteen@2024' },
  { id: 'vlot', name: "'t Vlot", pw: 'Vlot@2024' },
  { id: 'fonkel', name: 'De Fonkel', pw: 'Fonkel@2024' },
  { id: 'revinze', name: 'De Revinze', pw: 'Revinze@2024' },
  { id: 'negensprong', name: 'De Negensprong', pw: 'Negensprong@2024' },
  { id: 'schatkist', name: 'De Schatkist', pw: 'Schatkist@2024' }
];

const vakken = ['Nederlands', 'Wiskunde', 'Frans', 'WO', 'Muzische vorming', 'LO', 'Godsdienst', 'ICT'];
const niveaus = ['P', 'K', 'L1', 'L2', 'L3', 'L4', 'L5', 'L6'];
const niveauLabels = { P: 'Peuterklas', K: 'Kleuterklas', L1: 'Leerjaar 1', L2: 'Leerjaar 2', L3: 'Leerjaar 3', L4: 'Leerjaar 4', L5: 'Leerjaar 5', L6: 'Leerjaar 6' };

// Initiële methodes en uitgeverijen
const initMethodes = {
  'Tijd voor Taal': 'Van In',
  'Nieuwe Taalverhaal': 'Plantyn',
  'Taal actief': 'Malmberg',
  'Pluspunt': 'Malmberg',
  'Nieuwe Tal-rijk': 'Plantyn',
  'Kompas': 'VAN IN',
  'Mundo': 'Plantyn',
  'Bandito': 'Die Keure',
  'Alles Telt': 'ThiemeMeulenhoff',
  'Zo gezegd': 'Pelckmans',
  'Quartier Latin': 'Plantyn',
  'Eventail Junior': 'Die Keure'
};

// ============================================
// LOGIN COMPONENT
// ============================================
function Login({ onLogin }) {
  const [school, setSchool] = React.useState('');
  const [pw, setPw] = React.useState('');
  const [err, setErr] = React.useState('');

  const handleLogin = () => {
    const s = schools.find(x => x.id === school);
    if (!s) { setErr('Kies een school'); return; }
    if (pw !== s.pw) { setErr('Ongeldig wachtwoord'); return; }
    onLogin(s);
  };

  return (
    <div className="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-purple-50 flex items-center justify-center p-4">
      <div className="bg-white rounded-3xl shadow-2xl max-w-md w-full p-8">
        <div className="text-center mb-8">
          <div className="w-16 h-16 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4 shadow-lg">📚</div>
          <h1 className="text-2xl font-bold text-slate-800">Methodes Overzicht</h1>
          <p className="text-slate-500 mt-1">Scholengroep Sint-Rembert</p>
        </div>
        <div className="space-y-4">
          <div>
            <label className="block text-sm font-medium text-slate-700 mb-2">School</label>
            <select value={school} onChange={e => { setSchool(e.target.value); setErr(''); }} className="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
              <option value="">Kies je school...</option>
              {schools.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
          </div>
          <div>
            <label className="block text-sm font-medium text-slate-700 mb-2">Wachtwoord</label>
            <input type="password" value={pw} onChange={e => { setPw(e.target.value); setErr(''); }} onKeyDown={e => e.key === 'Enter' && handleLogin()} placeholder="Voer wachtwoord in" className="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
          </div>
          {err && <p className="text-red-500 text-sm bg-red-50 p-3 rounded-xl">{err}</p>}
          <button onClick={handleLogin} className="w-full py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold rounded-xl hover:from-indigo-700 hover:to-purple-700 transition-all shadow-lg">
            Inloggen
          </button>
        </div>
      </div>
    </div>
  );
}

// ============================================
// SCHOOL DETAIL COMPONENT
// ============================================
function SchoolDetail({ school, data, methodeUitg, onBack, isOwnSchool, onEdit }) {
  const schoolData = data[school.id] || {};
  
  const kleuren = {
    Nederlands: 'from-blue-400 to-blue-600',
    Wiskunde: 'from-green-400 to-green-600',
    Frans: 'from-red-400 to-red-600',
    WO: 'from-yellow-400 to-yellow-600',
    'Muzische vorming': 'from-pink-400 to-pink-600',
    LO: 'from-orange-400 to-orange-600',
    Godsdienst: 'from-purple-400 to-purple-600',
    ICT: 'from-cyan-400 to-cyan-600'
  };

  return (
    <div className="space-y-6">
      {/* Header */}
      <div className="flex items-center justify-between">
        <div className="flex items-center gap-4">
          <button onClick={onBack} className="p-2 hover:bg-slate-100 rounded-xl transition-colors">
            ← Terug
          </button>
          <div className="flex items-center gap-3">
            <div className="w-12 h-12 bg-indigo-100 rounded-xl flex items-center justify-center text-2xl">🏫</div>
            <div>
              <h2 className="text-xl font-bold text-slate-800">{school.name}</h2>
              {isOwnSchool && <span className="text-xs text-indigo-600 font-medium">Jouw school</span>}
            </div>
          </div>
        </div>
        {isOwnSchool && (
          <button onClick={onEdit} className="px-4 py-2 bg-indigo-600 text-white rounded-xl font-medium hover:bg-indigo-700">
            ✏️ Bewerken
          </button>
        )}
      </div>

      {/* Methodes per vak */}
      {vakken.map(vak => {
        const vakData = schoolData[vak] || {};
        const hasData = niveaus.some(niv => vakData[niv]);
        
        return (
          <div key={vak} className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
            <div className={`p-4 border-b border-slate-100 bg-gradient-to-r ${kleuren[vak]} bg-opacity-10`}>
              <div className="flex items-center gap-3">
                <div className={`w-3 h-8 rounded-full bg-gradient-to-b ${kleuren[vak]}`}></div>
                <h3 className="font-bold text-slate-800">{vak}</h3>
              </div>
            </div>
            <div className="p-4">
              {hasData ? (
                <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
                  {niveaus.map(niv => {
                    const methode = vakData[niv];
                    if (!methode) return null;
                    return (
                      <div key={niv} className="bg-slate-50 rounded-xl p-3">
                        <span className="text-xs font-medium text-slate-500 block mb-1">{niveauLabels[niv]}</span>
                        <span className="text-sm font-medium text-slate-800">{methode}</span>
                        <span className="text-xs text-slate-400 block">{methodeUitg[methode] || ''}</span>
                      </div>
                    );
                  })}
                </div>
              ) : (
                <p className="text-slate-400 italic text-sm">Geen methodes ingevuld voor dit vak</p>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ============================================
// HOOFD APP COMPONENT
// ============================================
function App() {
  const [user, setUser] = React.useState(null);
  const [view, setView] = React.useState('vak');
  const [niveau, setNiveau] = React.useState('Alle');
  const [jaar, setJaar] = React.useState('2025-2026');
  const [data, setData] = React.useState({});
  const [methodeUitg, setMethodeUitg] = React.useState({...initMethodes});
  const [edit, setEdit] = React.useState(false);
  const [editData, setEditData] = React.useState({});
  const [modal, setModal] = React.useState(null);
  const [toast, setToast] = React.useState(null);
  const [syncStatus, setSyncStatus] = React.useState({ time: null, loading: false });
  const [history, setHistory] = React.useState([]);
  const [selectedSchool, setSelectedSchool] = React.useState(null);

  // Add methode modal state
  const [addNaam, setAddNaam] = React.useState('');
  const [addUitg, setAddUitg] = React.useState('');
  const [addErr, setAddErr] = React.useState('');

  // Load data on mount
  React.useEffect(() => {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      setData(parsed.data || {});
      setMethodeUitg(parsed.methodeUitg || {...initMethodes});
      setHistory(parsed.history || []);
    }
  }, []);

  // Save data on change
  React.useEffect(() => {
    if (Object.keys(data).length > 0) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ data, methodeUitg, history }));
    }
  }, [data, methodeUitg, history]);

  // Sync from Google Sheets
  const syncData = async () => {
    setSyncStatus({ ...syncStatus, loading: true });
    try {
      const res = await fetch(SHEET_URL);
      const json = await res.json();
      if (json.data) {
        setData(json.data);
        if (json.methodeUitg) setMethodeUitg(json.methodeUitg);
        setSyncStatus({ time: new Date().toLocaleTimeString('nl-BE'), loading: false });
        showToast('✅ Gesynchroniseerd!', 'success');
      }
    } catch (e) {
      setSyncStatus({ ...syncStatus, loading: false });
      showToast('❌ Sync mislukt', 'error');
    }
  };

  // Toast helper
  const showToast = (msg, type = 'success') => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 3000);
  };

  // Get unique lists
  const mList = Object.keys(methodeUitg).sort();
  const uList = [...new Set(Object.values(methodeUitg))].sort();

  // Start edit mode
  const startEdit = () => {
    const schoolData = data[user.id] || {};
    setEditData(JSON.parse(JSON.stringify(schoolData)));
    setEdit(true);
    setSelectedSchool(null);
    setView('vak');
  };

  // Save edits
  const saveEdit = () => {
    const newData = { ...data, [user.id]: editData };
    setData(newData);
    
    // Add to history
    const entry = { time: new Date().toISOString(), school: user.name, action: 'Methodes bijgewerkt' };
    setHistory([entry, ...history].slice(0, 50));
    
    setEdit(false);
    showToast('✅ Opgeslagen!');
  };

  // Add new methode
  const addMethode = () => {
    if (!addNaam.trim()) { setAddErr('Vul een naam in'); return; }
    if (!addUitg.trim()) { setAddErr('Kies een uitgeverij'); return; }
    if (methodeUitg[addNaam.trim()]) { setAddErr('Deze methode bestaat al'); return; }
    
    setMethodeUitg({ ...methodeUitg, [addNaam.trim()]: addUitg.trim() });
    setModal(null);
    setAddNaam('');
    setAddUitg('');
    setAddErr('');
    showToast('✅ Methode toegevoegd!');
  };

  // Export CSV
  const exportCSV = (allSchools = false) => {
    let csv = 'School,Vak,Niveau,Methode,Uitgeverij\n';
    const schoolsToExport = allSchools ? schools : [user];
    
    schoolsToExport.forEach(s => {
      const schoolData = data[s.id] || {};
      vakken.forEach(vak => {
        niveaus.forEach(niv => {
          const methode = schoolData[vak]?.[niv] || '';
          if (methode) {
            csv += `"${s.name}","${vak}","${niveauLabels[niv]}","${methode}","${methodeUitg[methode] || ''}"\n`;
          }
        });
      });
    });
    
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `methodes-${allSchools ? 'alle-scholen' : user.id}-${jaar}.csv`;
    a.click();
    setModal(null);
  };

  // Count schools using a methode
  const countSchools = (methode) => {
    let count = 0;
    schools.forEach(s => {
      const schoolData = data[s.id] || {};
      vakken.forEach(vak => {
        niveaus.forEach(niv => {
          if (schoolData[vak]?.[niv] === methode) count++;
        });
      });
    });
    return count;
  };

  // Count methodes for a school
  const countMethodes = (schoolId) => {
    const schoolData = data[schoolId] || {};
    let count = 0;
    vakken.forEach(vak => {
      niveaus.forEach(niv => {
        if (schoolData[vak]?.[niv]) count++;
      });
    });
    return count;
  };

  // Render login if not logged in
  if (!user) return <Login onLogin={setUser} />;

  // Filter by niveau
  const filterNiveau = (niv) => niveau === 'Alle' || niveau === niv;

  return (
    <div className="min-h-screen bg-slate-50">
      {/* Toast */}
      {toast && (
        <div className={`fixed top-4 right-4 px-6 py-3 rounded-xl shadow-lg z-50 ${toast.type === 'success' ? 'bg-green-500' : 'bg-red-500'} text-white font-medium`}>
          {toast.msg}
        </div>
      )}

      {/* Header */}
      <header className="bg-white border-b border-slate-200 sticky top-0 z-40">
        <div className="max-w-7xl mx-auto px-4 py-4">
          <div className="flex items-center justify-between flex-wrap gap-4">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center text-xl">📚</div>
              <div>
                <h1 className="font-bold text-slate-800">Methodes</h1>
                <p className="text-xs text-slate-500">{user.name}</p>
              </div>
            </div>
            
            <div className="flex items-center gap-2">
              {/* Sync button */}
              <button onClick={syncData} disabled={syncStatus.loading} className="p-2 hover:bg-slate-100 rounded-xl transition-colors" title="Synchroniseren">
                <span className={syncStatus.loading ? 'animate-spin inline-block' : ''}>🔄</span>
              </button>
              
              {/* Sync status */}
              <div className="text-xs text-slate-500 hidden sm:block">
                {syncStatus.time ? `☁️ ${syncStatus.time}` : '☁️ Niet gesync'}
              </div>
              
              {/* Jaar selector */}
              <select value={jaar} onChange={e => setJaar(e.target.value)} className="px-3 py-2 border border-slate-200 rounded-xl text-sm">
                <option value="2025-2026">2025-2026</option>
                <option value="2026-2027">2026-2027</option>
              </select>
              
              {/* Export button */}
              <button onClick={() => setModal('export')} className="px-3 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-sm font-medium transition-colors">
                📥 Export
              </button>
              
              {/* History button */}
              <button onClick={() => setModal('history')} className="px-3 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-sm font-medium transition-colors">
                📋
              </button>
              
              {/* Logout */}
              <button onClick={() => { setUser(null); setSelectedSchool(null); }} className="px-3 py-2 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl text-sm font-medium transition-colors">
                Uitloggen
              </button>
            </div>
          </div>
          
          {/* Views - hide when viewing school detail */}
          {!selectedSchool && (
            <>
              <div className="flex gap-2 mt-4 flex-wrap">
                {['vak', 'school', 'uitgeverij', 'methode', 'tabel'].map(v => (
                  <button key={v} onClick={() => setView(v)} className={`px-4 py-2 rounded-xl text-sm font-medium transition-colors ${view === v ? 'bg-indigo-600 text-white' : 'bg-slate-100 hover:bg-slate-200 text-slate-700'}`}>
                    {v === 'vak' ? 'Per vak' : v === 'school' ? 'Per school' : v === 'uitgeverij' ? 'Per uitgeverij' : v === 'methode' ? 'Per methode' : 'Tabel'}
                  </button>
                ))}
              </div>
              
              {/* Niveau filter */}
              <div className="flex gap-2 mt-3 flex-wrap">
                {['Alle', ...niveaus].map(n => (
                  <button key={n} onClick={() => setNiveau(n)} className={`px-3 py-1.5 rounded-lg text-xs font-medium transition-colors ${niveau === n ? 'bg-purple-600 text-white' : 'bg-slate-100 hover:bg-slate-200 text-slate-600'}`}>
                    {n === 'Alle' ? 'Alle niveaus' : niveauLabels[n] || n}
                  </button>
                ))}
              </div>
            </>
          )}
        </div>
      </header>

      {/* Main Content */}
      <main className="max-w-7xl mx-auto px-4 py-6">
        {/* School Detail View */}
        {selectedSchool && (
          <SchoolDetail 
            school={selectedSchool} 
            data={data} 
            methodeUitg={methodeUitg}
            onBack={() => setSelectedSchool(null)}
            isOwnSchool={selectedSchool.id === user.id}
            onEdit={startEdit}
          />
        )}

        {/* Edit mode banner */}
        {edit && !selectedSchool && (
          <div className="bg-yellow-50 border border-yellow-200 rounded-xl p-4 mb-6 flex items-center justify-between">
            <span className="text-yellow-800 font-medium">✏️ Je bent aan het bewerken</span>
            <div className="flex gap-2">
              <button onClick={() => setEdit(false)} className="px-4 py-2 bg-white border border-slate-200 rounded-xl text-sm font-medium hover:bg-slate-50">Annuleren</button>
              <button onClick={saveEdit} className="px-4 py-2 bg-green-600 text-white rounded-xl text-sm font-medium hover:bg-green-700">Opslaan</button>
            </div>
          </div>
        )}

        {/* VIEW: Per vak */}
        {view === 'vak' && !selectedSchool && (
          <div className="space-y-6">
            <div className="flex justify-between items-center">
              <h2 className="text-xl font-bold text-slate-800">Methodes per vak - {user.name}</h2>
              {!edit && <button onClick={startEdit} className="px-4 py-2 bg-indigo-600 text-white rounded-xl font-medium hover:bg-indigo-700">✏️ Bewerken</button>}
            </div>
            
            {vakken.map(vak => (
              <div key={vak} className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
                <div className="p-4 border-b border-slate-100 bg-slate-50">
                  <h3 className="font-bold text-slate-800">{vak}</h3>
                </div>
                <div className="p-4 grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
                  {niveaus.filter(filterNiveau).map(niv => {
                    const schoolData = edit ? editData : (data[user.id] || {});
                    const methode = schoolData[vak]?.[niv] || '';
                    
                    return (
                      <div key={niv} className="bg-slate-50 rounded-xl p-3">
                        <span className="text-xs font-medium text-slate-500 block mb-2">{niveauLabels[niv]}</span>
                        {edit ? (
                          <select 
                            value={methode} 
                            onChange={e => {
                              const newEditData = {...editData};
                              if (!newEditData[vak]) newEditData[vak] = {};
                              newEditData[vak][niv] = e.target.value;
                              setEditData(newEditData);
                            }}
                            className="w-full p-2 border border-slate-200 rounded-lg text-sm"
                          >
                            <option value="">Geen methode</option>
                            {mList.map(m => <option key={m} value={m}>{m}</option>)}
                          </select>
                        ) : (
                          <span className={`text-sm ${methode ? 'text-slate-800 font-medium' : 'text-slate-400 italic'}`}>
                            {methode || 'Geen methode'}
                          </span>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        )}

        {/* VIEW: Per school */}
        {view === 'school' && !selectedSchool && (
          <div className="space-y-6">
            <h2 className="text-xl font-bold text-slate-800">Alle scholen</h2>
            <p className="text-slate-500 text-sm">Klik op een school om de methodes te bekijken</p>
            <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
              {schools.map(s => {
                const count = countMethodes(s.id);
                
                return (
                  <button 
                    key={s.id} 
                    onClick={() => setSelectedSchool(s)}
                    className={`bg-white rounded-2xl border p-5 text-left hover:shadow-lg hover:border-indigo-300 transition-all ${s.id === user.id ? 'border-indigo-300 ring-2 ring-indigo-100' : 'border-slate-200'}`}
                  >
                    <div className="flex items-center gap-3 mb-3">
                      <div className="w-10 h-10 bg-indigo-100 rounded-xl flex items-center justify-center text-lg">🏫</div>
                      <div>
                        <h3 className="font-bold text-slate-800">{s.name}</h3>
                        {s.id === user.id && <span className="text-xs text-indigo-600 font-medium">Jouw school</span>}
                      </div>
                    </div>
                    <p className="text-sm text-slate-500">{count} methode(s)</p>
                  </button>
                );
              })}
            </div>
          </div>
        )}

        {/* VIEW: Per uitgeverij */}
        {view === 'uitgeverij' && !selectedSchool && (
          <div className="space-y-6">
            <h2 className="text-xl font-bold text-slate-800">Per uitgeverij</h2>
            {uList.map(uitg => {
              const methodes = mList.filter(m => methodeUitg[m] === uitg);
              return (
                <div key={uitg} className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
                  <div className="p-4 border-b border-slate-100 bg-slate-50 flex items-center gap-3">
                    <div className="w-10 h-10 bg-purple-100 rounded-xl flex items-center justify-center text-lg">📖</div>
                    <div>
                      <h3 className="font-bold text-slate-800">{uitg}</h3>
                      <p className="text-xs text-slate-500">{methodes.length} methode(s)</p>
                    </div>
                  </div>
                  <div className="p-4 grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
                    {methodes.map(m => (
                      <div key={m} className="bg-slate-50 rounded-xl p-3">
                        <span className="font-medium text-slate-800">{m}</span>
                        <span className="text-xs text-slate-500 block mt-1">🏫 {countSchools(m)} school(en)</span>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {/* VIEW: Per methode */}
        {view === 'methode' && !selectedSchool && (
          <div className="space-y-6">
            <div className="flex justify-between items-center">
              <h2 className="text-xl font-bold text-slate-800">Alle methodes (A-Z)</h2>
              <button onClick={() => setModal('add')} className="px-4 py-2 bg-green-600 text-white rounded-xl font-medium hover:bg-green-700">➕ Nieuwe methode</button>
            </div>
            <p className="text-slate-500 text-sm">Staat een methode er niet bij? Voeg ze hier toe. Daarna vind je ze terug in de dropdown bij jouw school.</p>
            <div className="bg-white rounded-2xl border border-slate-200 p-5">
              <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
                {mList.map(m => (
                  <div key={m} className="bg-slate-50 border border-slate-100 rounded-xl p-4">
                    <h4 className="font-semibold text-slate-800 mb-1">{m}</h4>
                    <p className="text-xs text-slate-500">{methodeUitg[m]}</p>
                    <p className="text-xs text-slate-400 mt-2">🏫 {countSchools(m)} school(en)</p>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {/* VIEW: Tabel */}
        {view === 'tabel' && !selectedSchool && (
          <div className="space-y-6">
            <h2 className="text-xl font-bold text-slate-800">Tabeloverzicht</h2>
            <div className="bg-white rounded-2xl border border-slate-200 overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className="bg-slate-50 border-b border-slate-200">
                    <th className="p-3 text-left font-semibold text-slate-700">Methode</th>
                    <th className="p-3 text-left font-semibold text-slate-700">Uitgeverij</th>
                    <th className="p-3 text-center font-semibold text-slate-700">Aantal scholen</th>
                  </tr>
                </thead>
                <tbody>
                  {mList.map((m, i) => {
                    const count = countSchools(m);
                    return (
                      <tr key={m} className={i % 2 === 0 ? 'bg-white' : 'bg-slate-50'}>
                        <td className="p-3 font-medium text-slate-800">{m}</td>
                        <td className="p-3 text-slate-600">{methodeUitg[m]}</td>
                        <td className="p-3 text-center">
                          <span className={`inline-flex items-center justify-center w-8 h-8 rounded-full text-sm font-bold ${count > 0 ? 'bg-indigo-100 text-indigo-700' : 'bg-slate-100 text-slate-400'}`}>
                            {count}
                          </span>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        )}
      </main>

      {/* MODAL: Add methode */}
      {modal === 'add' && (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-2xl max-w-md w-full p-6">
            <h3 className="text-xl font-bold text-slate-800 mb-4">Nieuwe methode toevoegen</h3>
            <div className="space-y-4">
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-2">Naam methode</label>
                <input type="text" value={addNaam} onChange={e => { setAddNaam(e.target.value); setAddErr(''); }} placeholder="Bijv. Pluspunt" className="w-full p-3 border border-slate-200 rounded-xl" />
              </div>
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-2">Uitgeverij</label>
                <select value={addUitg} onChange={e => {
                  if (e.target.value === '__new__') {
                    const nieuw = prompt('Naam nieuwe uitgeverij:');
                    if (nieuw && nieuw.trim()) {
                      setAddUitg(nieuw.trim());
                    }
                  } else {
                    setAddUitg(e.target.value);
                  }
                  setAddErr('');
                }} className="w-full p-3 border border-slate-200 rounded-xl">
                  <option value="">Kies uitgeverij...</option>
                  {uList.map(u => <option key={u} value={u}>{u}</option>)}
                  <option value="__new__">➕ Nieuwe uitgeverij...</option>
                </select>
                {addUitg && !uList.includes(addUitg) && (
                  <div className="text-sm text-green-600 mt-2">✓ Nieuwe uitgeverij: {addUitg}</div>
                )}
              </div>
              {addErr && <p className="text-red-500 text-sm">{addErr}</p>}
            </div>
            <div className="flex gap-3 mt-6">
              <button onClick={() => { setModal(null); setAddNaam(''); setAddUitg(''); setAddErr(''); }} className="flex-1 py-3 bg-slate-100 rounded-xl font-medium hover:bg-slate-200">Annuleren</button>
              <button onClick={addMethode} className="flex-1 py-3 bg-green-600 text-white rounded-xl font-medium hover:bg-green-700">Toevoegen</button>
            </div>
          </div>
        </div>
      )}

      {/* MODAL: Export */}
      {modal === 'export' && (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-2xl max-w-md w-full p-6">
            <h3 className="text-xl font-bold text-slate-800 mb-4">Exporteren</h3>
            <div className="space-y-3">
              <button onClick={() => exportCSV(false)} className="w-full p-4 bg-slate-50 hover:bg-slate-100 rounded-xl text-left transition-colors">
                <span className="font-medium text-slate-800">📥 Alleen {user.name}</span>
                <p className="text-sm text-slate-500 mt-1">Download methodes van jouw school</p>
              </button>
              <button onClick={() => exportCSV(true)} className="w-full p-4 bg-slate-50 hover:bg-slate-100 rounded-xl text-left transition-colors">
                <span className="font-medium text-slate-800">📥 Alle scholen</span>
                <p className="text-sm text-slate-500 mt-1">Download methodes van alle 15 scholen</p>
              </button>
            </div>
            <button onClick={() => setModal(null)} className="w-full py-3 mt-4 bg-slate-100 rounded-xl font-medium hover:bg-slate-200">Sluiten</button>
          </div>
        </div>
      )}

      {/* MODAL: History */}
      {modal === 'history' && (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-2xl max-w-md w-full p-6 max-h-[80vh] overflow-y-auto">
            <h3 className="text-xl font-bold text-slate-800 mb-4">Geschiedenis</h3>
            {history.length === 0 ? (
              <p className="text-slate-500 text-center py-8">Nog geen wijzigingen</p>
            ) : (
              <div className="space-y-2">
                {history.map((h, i) => (
                  <div key={i} className="p-3 bg-slate-50 rounded-xl">
                    <p className="font-medium text-slate-800">{h.school}</p>
                    <p className="text-sm text-slate-500">{h.action}</p>
                    <p className="text-xs text-slate-400 mt-1">{new Date(h.time).toLocaleString('nl-BE')}</p>
                  </div>
                ))}
              </div>
            )}
            <button onClick={() => setModal(null)} className="w-full py-3 mt-4 bg-slate-100 rounded-xl font-medium hover:bg-slate-200">Sluiten</button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
